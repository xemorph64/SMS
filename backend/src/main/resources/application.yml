# MailSentinel backend configuration.
#
# The default profile runs on an embedded H2 database in PostgreSQL
# compatibility mode, so `mvn spring-boot:run` works on a clean machine with no
# database installed.  PostgreSQL is the production target — start it with
# `docker compose up -d postgres` and run with `--spring.profiles.active=postgres`.

spring:
  application:
    name: mailsentinel
  datasource:
    url: jdbc:h2:file:./data/smsdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; JPA only checks it
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  # Cloud Run, Render, Railway and Heroku hand the port in PORT; everywhere else
  # 8080. Binding the variable rather than a constant is the whole difference
  # between a service that answers on those platforms and one that is killed
  # for never opening the port it was told to.
  port: ${PORT:8080}
  # Behind the platform's TLS terminator (Cloud Run, Render, Fly), honour
  # X-Forwarded-* so the app sees https and the real client address.
  forward-headers-strategy: framework
  error:
    include-message: always

ms:
  engine:
    python: ${SMS_PYTHON:python3}
    demo-dir: ${SMS_DEMO_DIR:demo-pcaps}
    upload-dir: ${SMS_UPLOAD_DIR:./data/uploads}
    timeout-seconds: 300
    ml-enabled: true
    max-upload-bytes: 2147483648
  cors:
    # Comma-separated origins allowed to call /api. Defaults to the Vite dev
    # server; a split deployment sets SMS_CORS_ORIGINS to the dashboard's URL
    # (wildcards such as https://*.vercel.app cover preview deployments).
    allowed-origins: ${SMS_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # HS256 signing key. Empty means the built-in development secret; every
    # deployment must set SMS_JWT_SECRET (openssl rand -base64 48).
    secret: ${SMS_JWT_SECRET:}

logging:
  level:
    in.gov.ntro.sih.sms: INFO
    org.hibernate.SQL: WARN

---
# PostgreSQL — the production target.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SMS_DB_URL:jdbc:postgresql://localhost:5432/mailsentinel}
    driver-class-name: org.postgresql.Driver
    username: ${SMS_DB_USER:sms}
    password: ${SMS_DB_PASSWORD:sms}
  h2:
    console:
      enabled: false
